# Ontologies in practice: Apache Jena and Apache Gravitino
#
#   docker compose up -d          start everything and load the sample
#   ./find-sensitive              ask the ontology which columns hold sensitive data
#   ./write-back card             tag the card column in Gravitino
#
# Services:
#   fuseki     Apache Jena Fuseki, SPARQL server and web UI     http://localhost:3030
#   gravitino  Apache Gravitino 1.3.1, catalog and web UI       http://localhost:8090
#              plus its Iceberg REST catalog service            http://localhost:9001/iceberg/
#   postgres   where the Iceberg catalog keeps table pointers (internal only)
#   spark      Apache Spark 3.5 with Iceberg, for SQL against the tables
#   init*      one-shot jobs that load the sample, then exit

name: jena-gravitino

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg"]
      interval: 5s
      retries: 20

  gravitino:
    image: apache/gravitino:1.3.1
    # root, so the server can write Iceberg metadata into the shared warehouse
    # volume that Spark also writes data files into
    user: root
    entrypoint: ["/bin/bash", "/demo/entrypoint.sh"]
    environment:
      SKIP_CONFIG_REWRITE: "true"
    ports:
      - "8090:8090"
      - "9001:9001"
    volumes:
      - ./gravitino/gravitino.conf:/opt/gravitino/conf/gravitino.conf:ro
      - ./gravitino/entrypoint.sh:/demo/entrypoint.sh:ro
      - gravitino-data:/opt/gravitino/data
      - warehouse:/data/warehouse
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/api/version >/dev/null"]
      interval: 5s
      retries: 60

  fuseki:
    build: ./fuseki
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki/databases
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/3030'"]
      interval: 5s
      retries: 30

  spark:
    build: ./spark
    command: ["sleep", "infinity"]
    volumes:
      - warehouse:/data/warehouse
      - ./seed:/seed:ro
    depends_on:
      gravitino:
        condition: service_healthy

  # --- one-shot jobs -------------------------------------------------------

  init:
    image: python:3.12-slim
    working_dir: /scripts
    command: ["python", "-u", "setup.py"]
    volumes:
      - ./scripts:/scripts:ro
      - ./ontology:/ontology:ro
    depends_on:
      gravitino:
        condition: service_healthy
      fuseki:
        condition: service_healthy

  init-tables:
    build: ./spark
    command: ["bash", "-c", "test -f /data/warehouse/.seeded || (spark-sql -f /seed/seed.sql && touch /data/warehouse/.seeded)"]
    volumes:
      - warehouse:/data/warehouse
      - ./seed:/seed:ro
    depends_on:
      init:
        condition: service_completed_successfully

  init-estate:
    image: python:3.12-slim
    working_dir: /scripts
    command: ["bash", "-c", "python -u estate_tags.py && python -u mirror.py"]
    volumes:
      - ./scripts:/scripts:ro
      - ./ontology:/ontology:ro
    depends_on:
      init-tables:
        condition: service_completed_successfully

  # Runs the demo scripts: docker compose run --rm tools python find_sensitive.py
  # (the ./find-sensitive style wrappers do this for you)
  tools:
    image: python:3.12-slim
    working_dir: /scripts
    profiles: ["tools"]
    # Point the scripts at your own Gravitino: GRAVITINO_URL=http://host:8090 METALAKE=prod ./mirror
    environment:
      GRAVITINO_URL: ${GRAVITINO_URL:-http://gravitino:8090}
      FUSEKI_URL: ${FUSEKI_URL:-http://fuseki:3030/acme}
      METALAKE: ${METALAKE:-acme}
    volumes:
      - ./scripts:/scripts:ro
      - ./ontology:/ontology:ro
      - ./queries:/queries:ro

volumes:
  postgres-data:
  gravitino-data:
  fuseki-data:
  warehouse:
