# Fuseki access rules for the demo.
# The admin area (/$/...), which the web UI uses to list datasets, needs a login:
# user admin, password admin. Queries to /acme/sparql need no login.
[main]
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher

[users]
admin = admin, administrator

[roles]
administrator = *

[urls]
/$/ping   = anon
/$/stats  = anon
/$/**     = authcBasic, roles[administrator]
/**       = anon
